services:
  backend-dev:
    container_name: backend-dev
    build:
      context: .
    env_file:
      - .env.dev
    ports:
      - "4010:4000"
    command: sh -c "npx prisma generate && npx prisma db push && npm run start:prod"
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pharm-vision

networks:
  pharm-vision:

volumes:
  pgdata: